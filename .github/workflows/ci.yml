name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # BACKEND
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (all modules)
        run: |
          python -m py_compile \
            app/main.py \
            app/core/config.py \
            app/core/logging.py \
            app/api/routes.py \
            app/services/guardrails.py \
            app/services/model_client.py \
            app/services/rag_service.py \
            app/services/retriever.py \
            app/utils/encryption.py

      - name: Run tests
        run: python test.py

  build-backend-image:
    name: Backend — Build Docker Image
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          # DOWNLOAD_MODEL=false: skip the 470 MB model download in CI.
          # The model is downloaded at container startup on first run.
          build-args: |
            DOWNLOAD_MODEL=false
          tags: chatbot-latam-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend — Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  build-frontend-image:
    name: Frontend — Build Docker Image
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: widget/Dockerfile
          push: false
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          tags: chatbot-latam-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

